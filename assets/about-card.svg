<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="About me — quick facts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#00160e"/>
    </linearGradient>
    <linearGradient id="factsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06100b"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00C853" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect width="1000" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="400" rx="18" fill="url(#grid)"/>
  <rect x="6" y="6" width="988" height="388" rx="14" fill="none" stroke="#00C853" stroke-width="1" stroke-dasharray="10 6" opacity="0.32"/>

  <!-- window bar -->
  <circle cx="34" cy="28" r="6" fill="#00C853" opacity="0.9"/>
  <circle cx="56" cy="28" r="6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="78" cy="28" r="6" fill="#0D1117" stroke="#00C853" stroke-width="1.5"/>
  <text x="102" y="33" font-family="monospace" font-size="13" fill="#8B949E">~/profile/about-me</text>

  <line x1="24" y1="55" x2="976" y2="55" stroke="#00C853" stroke-opacity="0.18"/>

  <!-- intro -->
  <text x="40" y="98" font-family="'Press Start 2P', monospace" font-size="11" letter-spacing="2" fill="#00C853">WHO AM I</text>
  <text x="40" y="146" font-family="'Press Start 2P', monospace" font-size="26" fill="#FFFFFF">CURIOUS MIND.</text>
  <text x="40" y="186" font-family="'Press Start 2P', monospace" font-size="26" fill="#00C853">ALWAYS BUILDING.</text>

  <text x="40" y="232" font-family="monospace" font-size="16" fill="#C9D1D9">Based in Tashkent, Uzbekistan, I love turning</text>
  <text x="40" y="258" font-family="monospace" font-size="16" fill="#C9D1D9">ideas into real products — clean, useful, and</text>
  <text x="40" y="284" font-family="monospace" font-size="16" fill="#C9D1D9">built with care. Always learning something new.</text>

  <line x1="40" y1="312" x2="560" y2="312" stroke="#00C853" stroke-opacity="0.2"/>

  <text x="40" y="342" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">LEARN → BUILD → IMPROVE</text>
  <text x="560" y="342" text-anchor="end" font-family="'Press Start 2P', monospace" font-size="11" fill="#FFFFFF">STAY CURIOUS.</text>

  <!-- quick facts -->
  <rect x="600" y="78" width="360" height="292" rx="14" fill="url(#factsBg)" stroke="#00C853" stroke-opacity="0.28"/>

  <text x="624" y="110" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">QUICK FACTS</text>
  <line x1="624" y1="124" x2="936" y2="124" stroke="#00C853" stroke-opacity="0.18"/>

  <text x="624" y="154" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">AGE</text>
  <text x="624" y="178" font-family="monospace" font-size="17" fill="#FFFFFF">17</text>
  <line x1="624" y1="192" x2="936" y2="192" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="212" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">LOCATION</text>
  <text x="624" y="236" font-family="monospace" font-size="17" fill="#FFFFFF">Tashkent, Uzbekistan</text>
  <line x1="624" y1="250" x2="936" y2="250" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="270" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">INTERESTS</text>
  <text x="624" y="294" font-family="monospace" font-size="17" fill="#FFFFFF">Web · UI/UX · Design</text>
  <line x1="624" y1="308" x2="936" y2="308" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="328" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853">CURRENTLY</text>
  <text x="624" y="352" font-family="monospace" font-size="17" fill="#FFFFFF">Learning &amp; building</text>
</svg>
