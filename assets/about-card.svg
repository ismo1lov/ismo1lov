<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="About me — quick facts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#00160e"/>
    </linearGradient>
    <linearGradient id="factsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06100b"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00C853" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect width="1000" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="380" rx="18" fill="url(#grid)"/>
  <rect x="6" y="6" width="988" height="368" rx="14" fill="none" stroke="#00C853" stroke-width="1" stroke-dasharray="10 6" opacity="0.32"/>

  <!-- window bar -->
  <circle cx="34" cy="28" r="6" fill="#00C853" opacity="0.9"/>
  <circle cx="56" cy="28" r="6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="78" cy="28" r="6" fill="#0D1117" stroke="#00C853" stroke-width="1.5"/>
  <text x="102" y="33" font-family="monospace" font-size="13" fill="#8B949E">~/profile/about-me</text>

  <rect x="810" y="16" width="150" height="26" rx="13" fill="#00C853" fill-opacity="0.1" stroke="#00C853" stroke-opacity="0.45"/>
  <circle cx="828" cy="29" r="4" fill="#00C853">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="840" y="33" font-family="monospace" font-size="11" letter-spacing="1" fill="#00C853">BUILDING NOW</text>

  <line x1="24" y1="55" x2="976" y2="55" stroke="#00C853" stroke-opacity="0.18"/>

  <!-- intro -->
  <text x="40" y="98" font-family="'Press Start 2P', monospace" font-size="9" letter-spacing="2" fill="#00C853">WHO AM I</text>
  <text x="40" y="142" font-family="'Press Start 2P', monospace" font-size="22" fill="#FFFFFF">CURIOUS MIND.</text>
  <text x="40" y="178" font-family="'Press Start 2P', monospace" font-size="22" fill="#00C853">ALWAYS BUILDING.</text>

  <text x="40" y="220" font-family="monospace" font-size="13.5" fill="#C9D1D9">Based in Tashkent, Uzbekistan, I love turning ideas into</text>
  <text x="40" y="242" font-family="monospace" font-size="13.5" fill="#C9D1D9">real products — clean, useful, and built with care.</text>
  <text x="40" y="264" font-family="monospace" font-size="13.5" fill="#C9D1D9">Focused on learning something new every day.</text>

  <line x1="40" y1="292" x2="560" y2="292" stroke="#00C853" stroke-opacity="0.2"/>

  <text x="40" y="320" font-family="'Press Start 2P', monospace" font-size="9" fill="#00C853">LEARN → BUILD → IMPROVE</text>
  <text x="560" y="320" text-anchor="end" font-family="'Press Start 2P', monospace" font-size="9" fill="#FFFFFF">STAY CURIOUS.</text>

  <!-- quick facts -->
  <rect x="600" y="78" width="360" height="280" rx="14" fill="url(#factsBg)" stroke="#00C853" stroke-opacity="0.28"/>

  <text x="624" y="104" font-family="'Press Start 2P', monospace" font-size="9" fill="#00C853">QUICK FACTS</text>
  <line x1="624" y1="118" x2="936" y2="118" stroke="#00C853" stroke-opacity="0.18"/>

  <text x="624" y="148" font-family="'Press Start 2P', monospace" font-size="8" fill="#00C853">AGE</text>
  <text x="624" y="168" font-family="monospace" font-size="14" fill="#FFFFFF">17</text>
  <line x1="624" y1="182" x2="936" y2="182" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="206" font-family="'Press Start 2P', monospace" font-size="8" fill="#00C853">LOCATION</text>
  <text x="624" y="226" font-family="monospace" font-size="14" fill="#FFFFFF">Tashkent, Uzbekistan</text>
  <line x1="624" y1="240" x2="936" y2="240" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="264" font-family="'Press Start 2P', monospace" font-size="8" fill="#00C853">INTERESTS</text>
  <text x="624" y="284" font-family="monospace" font-size="14" fill="#FFFFFF">Web · UI/UX · Design</text>
  <line x1="624" y1="298" x2="936" y2="298" stroke="#00C853" stroke-opacity="0.12"/>

  <text x="624" y="322" font-family="'Press Start 2P', monospace" font-size="8" fill="#00C853">CURRENTLY</text>
  <text x="624" y="342" font-family="monospace" font-size="14" fill="#FFFFFF">Learning &amp; building</text>
</svg>
