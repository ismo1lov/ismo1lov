<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#001f12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Falling blocks -->
  <g>
    <rect x="80" y="-40" width="40" height="40" fill="#00C853" opacity="0.9" rx="6">
      <animate attributeName="y" from="-40" to="300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.9" to="0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="-40" width="30" height="30" fill="#00e676" opacity="0.8" rx="5">
      <animate attributeName="y" from="-40" to="300" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="-40" width="50" height="50" fill="#009624" opacity="0.7" rx="7">
      <animate attributeName="y" from="-40" to="300" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="470" y="-40" width="35" height="35" fill="#00C853" opacity="0.85" rx="5">
      <animate attributeName="y" from="-40" to="300" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="-40" width="45" height="45" fill="#00e676" opacity="0.75" rx="6">
      <animate attributeName="y" from="-40" to="300" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="-40" width="28" height="28" fill="#00C853" opacity="0.9" rx="4">
      <animate attributeName="y" from="-40" to="300" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="850" y="-40" width="55" height="55" fill="#009624" opacity="0.7" rx="8">
      <animate attributeName="y" from="-40" to="300" dur="5.4s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="980" y="-40" width="32" height="32" fill="#00e676" opacity="0.85" rx="5">
      <animate attributeName="y" from="-40" to="300" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1090" y="-40" width="42" height="42" fill="#00C853" opacity="0.8" rx="6">
      <animate attributeName="y" from="-40" to="300" dur="4.2s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Subtle glow lines -->
  <g opacity="0.2">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00C853" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#00C853" stroke-width="1"/>
  </g>
</svg>
