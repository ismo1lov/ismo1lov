<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#001f12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#bg2)"/>

  <!-- Falling blocks made of numbers -->
  <g font-family="'Press Start 2P', monospace" font-weight="bold">
    <text x="60" y="-30" font-size="22" fill="#00C853" text-anchor="middle">
