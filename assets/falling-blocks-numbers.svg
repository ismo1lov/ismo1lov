      <animate attributeName="y" from="-30" to="190" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="-30" font-size="18" fill="#00e676" text-anchor="middle">
      10
      <animate attributeName="y" from="-30" to="190" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
