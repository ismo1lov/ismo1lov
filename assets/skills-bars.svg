<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009624"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
  </defs>

  <!-- Frontend 90% -->
  <text x="0" y="35" font-family="monospace" font-size="14" fill="#FFFFFF">Frontend</text>
  <rect x="0" y="48" width="760" height="30" rx="6" fill="#1a2430" stroke="#00C853" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="48" width="0" height="30" rx="6" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="684" dur="2s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="770" y="35" font-family="monospace" font-size="12" fill="#00C853" text-anchor="end">90%</text>

  <!-- Backend 60% -->
  <text x="0" y="105" font-family="monospace" font-size="14" fill="#FFFFFF">Backend</text>
  <rect x="0" y="118" width="760" height="30" rx="6" fill="#1a2430" stroke="#00C853" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="118" width="0" height="30" rx="6" fill="url(#bar2)">
    <animate attributeName="width" from="0" to="456" dur="2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="770" y="105" font-family="monospace" font-size="12" fill="#00C853" text-anchor="end">60%</text>

  <!-- UI / UX 85% -->
  <text x="0" y="175" font-family="monospace" font-size="14" fill="#FFFFFF">UI / UX</text>
  <rect x="0" y="188" width="760" height="30" rx="6" fill="#1a2430" stroke="#00C853" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="188" width="0" height="30" rx="6" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="646" dur="2s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="770" y="175" font-family="monospace" font-size="12" fill="#00C853" text-anchor="end">85%</text>

  <!-- Database 60% -->
  <text x="0" y="245" font-family="monospace" font-size="14" fill="#FFFFFF">Database</text>
  <rect x="0" y="258" width="760" height="30" rx="6" fill="#1a2430" stroke="#00C853" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="258" width="0" height="30" rx="6" fill="url(#bar2)">
    <animate attributeName="width" from="0" to="456" dur="2s" begin="1.2s" fill="freeze"/>
  </rect>
  <text x="770" y="245" font-family="monospace" font-size="12" fill="#00C853" text-anchor="end">60%</text>

  <!-- Problem Solv. 85% -->
  <text x="0" y="315" font-family="monospace" font-size="14" fill="#FFFFFF">Problem Solv.</text>
  <rect x="0" y="328" width="760" height="30" rx="6" fill="#1a2430" stroke="#00C853" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="328" width="0" height="30" rx="6" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="646" dur="2s" begin="1.5s" fill="freeze"/>
  </rect>
  <text x="770" y="315" font-family="monospace" font-size="12" fill="#00C853" text-anchor="end">85%</text>
</svg>
