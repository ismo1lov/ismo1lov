<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="190" viewBox="0 0 440 190">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#001a0d"/>
    </linearGradient>
  </defs>
  <rect width="440" height="190" rx="14" fill="url(#tBg)"/>

  <!-- Falling 01 -->
  <g font-family="monospace" font-weight="bold" opacity="0.35">
    <text x="40" y="-10" font-size="16" fill="#00C853">01
      <animate attributeName="y" from="-10" to="200" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="-10" font-size="12" fill="#00e676">10
      <animate attributeName="y" from="-10" to="200" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="260" y="-10" font-size="15" fill="#009624">11
      <animate attributeName="y" from="-10" to="200" dur="6s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="-10" font-size="14" fill="#00C853">01
      <animate attributeName="y" from="-10" to="200" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Icons row -->
  <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg" x="40" y="65" width="50" height="50"/>
  <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" x="150" y="65" width="50" height="50"/>
  <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" x="260" y="65" width="50" height="50"/>
  <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg" x="370" y="65" width="50" height="50"/>
</svg>