<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280">
  <defs>
    <linearGradient id="border1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="pGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00C853" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="460" height="280" rx="14" fill="#0D1117"/>

  <!-- Animated border -->
  <rect x="4" y="4" width="452" height="272" rx="12" fill="none" stroke="url(#border1)" stroke-width="4" stroke-dasharray="600">
    <animate attributeName="stroke-dashoffset" from="0" to="1200" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="452" height="272" rx="12" fill="none" stroke="#00C853" stroke-width="4">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="230" y="50" font-family="'Press Start 2P', monospace" font-size="17" fill="#00C853" text-anchor="middle" filter="url(#pGlow)">LUMINA</text>

  <line x1="70" y1="70" x2="390" y2="70" stroke="#00C853" stroke-width="2" opacity="0.5"/>

  <text x="230" y="115" font-family="'Press Start 2P', monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">Full-Stack Web</text>
  <text x="230" y="143" font-family="'Press Start 2P', monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">App</text>

  <text x="230" y="178" font-family="monospace" font-size="15" fill="#FFFFFF" text-anchor="middle">Profile and portfolio platform</text>
  <text x="230" y="200" font-family="monospace" font-size="15" fill="#FFFFFF" text-anchor="middle">with frontend, backend and database.</text>

  <text x="230" y="228" font-family="monospace" font-size="15" fill="#C9D1D9" text-anchor="middle">TypeScript · Next.js · Node.js</text>

  <text x="230" y="256" font-family="'Press Start 2P', monospace" font-size="11" fill="#00C853" text-anchor="middle" filter="url(#pGlow)">VIEW REPOSITORY →</text>
</svg>